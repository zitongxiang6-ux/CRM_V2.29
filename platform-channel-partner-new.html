t(4,minmax(205px,1fr));gap:14px}.product-card{overflow:hidden;border:1px solid var(--line);background:#fff}.product-card-image{height:145px;display:grid;place-items:center;background:#f3f5f6;border-bottom:1px solid var(--line)}.device{width:88px;height:88px;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;padding:8px;border:1px solid #8f979f;background:linear-gradient(145deg,#edf0f2,#bbc1c6);box-shadow:0 7px 15px rgba(34,40,46,.12)}.device span{border:1px solid rgba(60,67,74,.18);background:rgba(255,255,255,.4)}.device.gold{background:linear-gradient(145deg,#faf4e9,#d4bd93)}.device.dark{background:linear-gradient(145deg,#5a5f65,#23272d)}.product-card-body{padding:13px}.product-card h2{min-height:42px;margin:0 0 7px;font-size:14px;font-weight:500;line-height:1.5}.product-card-foot{padding:0 13px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px}.price{color:var(--red);font-size:18px}.qty{width:72px;height:32px;padding:0 7px;border:1px solid var(--line-dark);border-radius:var(--radius)}.cart-bar{margin-top:12px;padding:12px 14px;display:flex;align-items:center;justify-content:flex-end;gap:18px;border:1px solid var(--line);background:var(--soft)}.modal-layer{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(22,25,31,.38)}.modal-layer.open{display:flex}.modal{width:min(980px,96vw);max-height:88vh;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}.modal-head{min-height:52px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:16px;font-weight:500}.modal-close{width:34px;height:34px;border:0;background:transparent;font-size:22px;color:var(--muted)}.modal-body{padding:16px 18px;overflow:auto}.modal-foot{min-height:56px;padding:10px 18px;display:flex;justify-content:flex-end;gap:8px;border-to {id:107,name:"Tile Series USB and Type-C Outlet",type:"Other",model:"MPST-UT-NP.18",code:"308080228",spec:"Space Gray-Metal",price:65,tone:"silver",laser:false},

const zh={platform:"\u5e73\u53f0\u6e20\u9053\u5546\u5e73\u53f0",mall:"\u4f18\u9009\u5546\u57ce\uff08\u56fd\u9645\uff09",cart:"\u8d2d\u7269\u8f66\uff08\u56fd\u9645\uff09",orders:"\u6807\u54c1\u8ba2\u5355\uff08\u56fd\u9645\uff09",hedong:"\u6cb3\u4e1c\u4f18\u9009",center:"\u8ba2\u5355\u4e2d\u5fc3"};

function product(id){return products.find(p=>p.id===Number(id))}function money(v,c="USD"){return(c==="HKD"?"HK$":"$")+Number(v||0).toFixed(2)}function dev(tone="silver"){return `<span class="device ${tone}"><span></span><span></span><span></span><span></span></span>`}function total(){return state.cart.filter(l=>l.selected).reduce((s,l)=>s+product(l.productId).price*l.qty,0)}
function pill(s){const m={"Pending Confirmation":"purple","Pending Review":"orange","Pending Payment":"orange","Paid":"green","Closed":"red"};return `<span class="pill ${m[s]||"blue"}">${s}</span>`}
function route(r){state.route=r;location.hash=r;render()}function shell(){document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.route===state.route));navCart.textContent=state.cart.length;topCart.textContent=state.cart.length;const m=routeMeta[state.route]||routeMeta.shop;breadcrumb.innerHTML=`${zh.platform}<span>/</span>${m[0]}<span>/</span><strong>${m[1]}</strong>`}
function page(title,sub,body,tabs=""){return `<section class="page">${tabs}<div class="page-body"><div class="page-head"><div><h1 class="page-title">${title}</h1><p class="page-subtitle">${sub}</p></div><div>${state.route==="shop"?`<button class="btn primary" onclick="route('cart')">Shopping Cart (${state.cart.length})</button>`:""}${state.route==="cart"?`<button class="btn" onclick="route('shop')">Back</button>`:""}</div></div>${body}</div></section>`}
function renderShop(){const rows=products.filter(p=>!state.keyword||`${p.name} ${p.code} ${p.model}`.toLowerCase().includes(state.keyword.toLowerCase()));const tabs='<div class="page-tabs"><button class="page-tab">Domestic</button><button class="page-tab active">International</button></div>';const body=`<div class="filters"><div class="field"><label>Product Name / ERP Number</label><input class="input" value="${state.keyword}" oninput="state.keyword=this.value;render()" placeholder="Please input"></div><div class="field"><label>Category</label><select class="select"><option>ALL</option><option>Intelligent Interaction</option><option>Auxiliary Equipment</option></select></div><div class="filter-actions"><button class="btn" onclick="state.keyword='';render()">Reset</button><button class="btn primary">Query</button></div></div><div class="product-grid">${rows.map(p=>`<article class="product-card"><div class="product-card-image">${dev(p.tone)}</div><div class="product-card-body"><h2>${p.name}</h2><p class="muted tiny">${p.type} | ${p.model}</p><p class="tiny">${p.spec}</p><strong class="price">${money(p.price)}</strong></div><div class="product-card-foot"><input class="qty" id="qty-${p.id}" type="number" min="1" value="1"><button class="btn primary small" onclick="addCart(${p.id})">Add to Cart</button></div></article>`).join("")}</div>`;return page(zh.mall,"International preferred products for channel partners",body,tabs)}
function renderCart(){
 const tabs='<div class="page-tabs"><button class="page-tab active">International</button></div>';
 const std=state.cart.filter(l=>!l.custom);
 const cus=state.cart.filter(l=>l.custom);
 const row=(l,custom)=>{const p=product(l.productId);return `<tr><td><input type="checkbox" ${l.selected?"checked":""} onchange="updCart(${l.productId},'selected',this.checked)"></td><td>${p.name}<br><span class="muted tiny">${p.model}</span></td><td>${p.spec}</td><td>${p.code}</td>${custom?"":`<td>${money(p.price)}</td>`}<td><input class="quantity-control" type="number" min="1" value="${l.qty}" onchange="updCart(${l.productId},'qty',this.value)"></td><td>${p.laser?`<select onchange="updCart(${l.productId},'laser',this.value)"><option ${l.laser==="Yes"?"selected":""}>Yes</option><option ${l.laser==="No"?"selected":""}>No</option></select>`:"--"}</td>${custom?`<td><input class="custom-cart-requirement" value="${l.customization||""}" oninput="updCart(${l.productId},'customization',this.value,true)"></td>`:`<td class="money">${money(p.price*l.qty)}</td>`}<td><div class="row-actions"><button class="view-command" onclick="alert('Product detail uses the same style as the mall detail page')">View</button><button class="delete-command" onclick="delCart(${l.productId})">Delete</button></div></td></tr>`};
 const selected=state.cart.filter(l=>l.selected), stdCount=selected.filter(l=>!l.custom).length, cusCount=selected.filter(l=>l.custom).length;
 const body=`${tabs}<div class="cart-section-head"><h1>Standard Products</h1><button class="continue-command" onclick="route('shop')">Continue Shopping &gt;&gt;&gt;</button></div><div class="inline-actions cart-batch"><button class="btn" onclick="state.cart=state.cart.filter(l=>!l.selected);render()" ${selected.length?"":"disabled"}>Mass Delete</button></div><div class="table-wrap commerce-table"><table><thead><tr><th>Select</th><th>Product Name</th><th>Product Specification</th><th>Product Code</th><th>Market Price</th><th>Quantity</th><th>Laser Engraving</th><th>Total</th><th>Operation</th></tr></thead><tbody>${std.map(l=>row(l,false)).join("")}</tbody></table></div><section class="nonstandard-cart"><div class="nonstandard-head"><h2>Non-standard Products</h2><p>Note: Prices for non-standard customized products are to be determined and will be finalized after HDL's review.</p></div><div class="table-wrap commerce-table"><table><thead><tr><th>Select</th><th>Product Name</th><th>Product Specification</th><th>Product Code</th><th>Quantity</th><th>Laser Engraving</th><th>Non-standard customization</th><th>Operation</th></tr></thead><tbody>${cus.map(l=>row(l,true)).join("")}</tbody></table></div></section><div class="cart-summary"><strong>Selected</strong><span>Standard Products: <b>${stdCount}</b></span><span>Non-standard Products: <b>${cusCount}</b></span><span>Total: <b>${money(total())}</b></span><span class="summary-note">(Non-standard product prices are not included)</span><button onclick="submitCart()" ${selected.length?"":"disabled"}>Submit</button></div>`;
 return `<section class="page cart-page">${body}</section>`;
}
function fOrders(){return state.orders.filter(o=>{const kw=state.orderNo.toLowerCase();return(!kw||`${o.no} ${o.project}`.toLowerCase().includes(kw))&&(!state.customer||o.customer===state.customer)&&(!state.status||o.status===state.status)&&(state.quick==="all"||o.status===state.quick)})}
function renderOrders(){
 const quicks=["all","Pending Confirmation","Pending Review","Pending Payment"];
 const quick=`<div class="quick-tabs">${quicks.map(q=>`<button class="quick-tab ${state.quick===q?"active":""}" onclick="state.quick='${q}';render()">${q==="all"?"All":q}<span>${q==="all"?state.orders.length:state.orders.filter(o=>o.status===q).length}</span></button>`).join("")}</div>`;
 const customers=[...new Set(state.orders.map(o=>o.customer))],statuses=[...new Set(state.orders.map(o=>o.status))];
 const filters=`<div class="filters"><div class="field"><label>Order Number</label><input class="input" value="${state.orderNo}" oninput="state.orderNo=this.value;render()" placeholder="Please enter order number"></div><div class="field"><label>Customer Name</label><select class="select" onchange="state.customer=this.value;render()"><option value="">Please select a client</option>${customers.map(c=>`<option ${state.customer===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label>Order Status</label><select class="select" onchange="state.status=this.value;render()"><option value="">Please select an order status</option>${statuses.map(s=>`<option ${state.status===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Project Name</label><input class="input" placeholder="Please enter a project name"></div><div class="filter-actions"><button class="btn" onclick="state.orderNo='';state.customer='';state.status='';state.quick='all';render()">Reset</button><button class="btn primary">Search</button></div></div>`;
 const rows=fOrders().map(o=>{const paid=o.paid||0,total=o.amount||0,sub=o.productTotal||total;return `<tr><td><button class="link" onclick="openAction('review',${o.id})">${o.no}</button></td><td>${o.customer}</td><td>${o.project}</td><td>${o.business||'Standard'}</td><td>${o.hdl||'-'}</td><td>${o.po||'-'}</td><td>${o.laser}</td><td>${o.date}</td><td class="money">${money(sub,o.currency)}</td><td class="money">${money(paid,o.currency)}</td><td class="money">${money(Math.max(0,total-paid),o.currency)}</td><td>${o.currency}</td><td class="money">${money(total,o.currency)}</td><td>${o.contract||'-'}</td><td>${o.tax||'Yes'}</td><td>${pill(o.status)}</td><td><div class="row-actions"><button class="btn blue small" onclick="openAction('review',${o.id})">Review</button><button class="btn purple small" onclick="openAction('modify',${o.id})">Modify</button><button class="btn small" onclick="openAction('address',${o.id})">Address</button><button class="btn orange small" onclick="openAction('pay',${o.id})">To Pay</button><button class="btn small" onclick="openAction('more',${o.id})">More</button></div></td></tr>`}).join("");
 const table=`<div class="table-wrap"><table style="min-width:1760px"><thead><tr><th>Order Number</th><th>Customer Name</th><th>Project Name</th><th>Business Type</th><th>HDL Ref No.</th><th>P.O. No.</th><th>Laser Engraving Required</th><th>Order Date</th><th>Product Subtotal</th><th>Amount Paid</th><th>Amount to be paid</th><th>Payment Currency</th><th>Total Amount Payable</th><th>Contract Number</th><th>Whether Tax Included</th><th>Order Status</th><th>Operation</th></tr></thead><tbody>${rows}</tbody></table></div><div class="pager"><span>Total ${fOrders().length}</span><button class="page-no">1</button><span>10/page</span></div>`;
 return page(zh.orders,"Channel partner standard order list",quick+filters+table);
}
function info(o){const rows=[["Order Number",o.no],["Customer Name",o.customer],["Project Name",o.project],["Project Number",o.projectNo],["Order Time",o.date],["Order Amount",money(o.amount,o.currency)],["Order Status",o.status],["Receiver",o.receiver],["Contact Number",o.phone],["Delivery Address",o.address],["Shipping Method",o.shipping],["Logistics Company",o.logistics],["Contract Number",o.contract],["Laser Engraving",o.laser]];return `<div class="kv">${rows.map(r=>`<div>${r[0]}</div><div>${r[1]}</div>`).join("")}</div>`}
function modalProducts(edit=false){return `<h3 class="section-head">Product Information</h3><div class="table-wrap"><table><thead><tr><th>Product</th><th>Product Number</th><th>Spec</th><th>Qty</th><th>Price</th><th>Laser</th></tr></thead><tbody>${state.cart.slice(0,3).map(l=>{const p=product(l.productId);return `<tr><td>${p.name}</td><td>${p.code}</td><td>${p.spec}</td><td>${edit?`<input class="qty" value="${l.qty}">`:l.qty}</td><td class="money">${money(p.price)}</td><td>${l.laser}</td></tr>`}).join("")}</tbody></table></div>`}
function openAction(kind,id){const o=state.orders.find(x=>x.id===id);if(!o)return;let title="",body="",foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAction('${kind}',${id})">Submit</button>`;if(kind==="review"){title="Review";body=info(o)+modalProducts();foot=`<button class="btn primary" onclick="closeModal()">Close</button>`}if(kind==="modify"){title="Modify Order";body=info(o)+`<h3 class="section-head">Modify Information</h3><div class="form-grid"><div class="field"><label>Project Name</label><input id="mProject" value="${o.project}"></div><div class="field"><label>PO No.</label><input id="mPo" value="${o.po}"></div><div class="field wide"><label>Order Remarks</label><textarea>Need confirm product configuration.</textarea></div></div>`+modalProducts(true)}if(kind==="address"){title="Modify Address";body=`<div class="form-grid"><div class="field"><label>Receiver</label><input id="mReceiver" value="${o.receiver}"></div><div class="field"><label>Contact Number</label><input id="mPhone" value="${o.phone}"></div><div class="field"><label>Shipping Method</label><select id="mShipping"><option>${o.shipping}</option><option>Freight Collect</option><option>HDL Prepaid Freight</option></select></div><div class="field"><label>Logistics Company</label><select id="mLogistics"><option>${o.logistics}</option><option>DHL</option><option>UPS</option><option>Fedex</option></select></div><div class="field wide"><label>Delivery Address</label><textarea id="mAddress">${o.address}</textarea></div></div>`}if(kind==="pay"){title="To Pay";body=info(o)+`<h3 class="section-head">Payment</h3><div class="form-grid"><div class="field"><label>Payment Amount</label><input value="${o.amount.toFixed(2)}"></div><div class="field"><label>Payment Method</label><select><option>T/T</option><option>Credit Card</option></select></div><div class="field wide"><label>Payment Voucher</label><input type="file"></div></div>`}if(kind==="more"){title="More Actions";body=`<div class="inline-actions">${actions.slice(3).map(a=>`<button class="btn ${a[0]==="cancel"?"red":""}" onclick="openAction('${a[0]}',${id})">${a[1]}</button>`).join("")}</div>`;foot=`<button class="btn primary" onclick="closeModal()">Close</button>`}if(kind==="another"){title="Another Order";body=`<div class="alert">Create a new order by copying ${o.no}. Product and address information can be adjusted before submit.</div>`+info(o)+modalProducts(true)}if(kind==="cancel"){title="Cancel Order";body=`<div class="alert">Order ${o.no} will be marked as Closed after submit.</div><div class="field"><label>Cancel Reason</label><textarea placeholder="Please enter"></textarea></div>`;foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn red" onclick="saveAction('cancel',${id})">Cancel Order</button>`}if(kind==="contract"){title="Download Contract";body=`<div class="table-wrap"><table><thead><tr><th>Contract No.</th><th>Order No.</th><th>Customer</th><th>Amount</th><th>Action</th></tr></thead><tbody><tr><td>${o.contract}</td><td>${o.no}</td><td>${o.customer}</td><td class="money">${money(o.amount,o.currency)}</td><td><button class="btn primary small">Download</button></td></tr></tbody></table></div>`;foot=`<button class="btn primary" onclick="closeModal()">Close</button>`}if(kind==="laser"){title="Link XX Laser";body=`<div class="form-grid"><div class="field"><label>Laser Engraving Required</label><select id="mLaser"><option ${o.laser==="Yes"?"selected":""}>Yes</option><option ${o.laser==="No"?"selected":""}>No</option></select></div><div class="field"><label>Product Number</label><input value="308013718"></div><div class="field wide"><label>Non-standard Customization</label><textarea>Icon and text engraving requirements for channel partner order.</textarea></div></div>`}modalTitle.textContent=title;modalBody.innerHTML=body;modalFoot.innerHTML=foot;modalLayer.classList.add("open")}
function closeModal(){modalLayer.classList.remove("open")}function saveAction(kind,id){const o=state.orders.find(x=>x.id===id);if(kind==="modify"){o.project=mProject.value;o.po=mPo.value}if(kind==="address"){o.receiver=mReceiver.value;o.phone=mPhone.value;o.address=mAddress.value;o.shipping=mShipping.value;o.logistics=mLogistics.value}if(kind==="pay")o.status="Paid";if(kind==="cancel")o.status="Closed";if(kind==="laser")o.laser=mLaser.value;if(kind==="another"){const n={...o,id:Math.max(...state.orders.map(x=>x.id))+1,no:"DD-2026-07-16000"+(state.orders.length+1),date:"2026-07-16",status:"Pending Confirmation"};state.orders.unshift(n)}closeModal();render()}
function addCart(id){const qty=Number(document.getElementById(`qty-${id}`).value||1),l=state.cart.find(x=>x.productId===id);if(l)l.qty+=qty;else state.cart.push({productId:id,qty,selected:true,laser:product(id).laser?"Yes":"--",customization:""});render()}function updCart(id,k,v,silent){const l=state.cart.find(x=>x.productId===id);if(!l)return;l[k]=k==="qty"?Math.max(1,Number(v||1)):v;if(!silent)render()}function delCart(id){state.cart=state.cart.filter(l=>l.productId!==id);render()}function submitCart(){if(!state.cart.some(l=>l.selected))return;const id=Math.max(...state.orders.map(o=>o.id))+1;state.orders.unshift({id,no:"DD-2026-07-16000"+id,customer:"River East Preferred",project:"Preferred Shop Order",projectNo:"XM-NEW-"+id,date:"2026-07-16",amount:total(),currency:"USD",status:"Pending Confirmation",receiver:"Camellia",phone:"12345678",address:"Georgia / Samegrelo-Zemo Svaneti 120",shipping:"HDL Prepaid Freight",logistics:"DHL",hdl:"HDL-NEW-"+id,po:"PO-NEW-"+id,contract:"HT-2026-07-16000"+id,laser:"Yes"});state.cart=state.cart.filter(l=>!l.selected);route("orders")}
function render(){shell();view.innerHTML=state.route==="cart"?renderCart():state.route==="orders"?renderOrders():renderShop()}document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>route(b.dataset.route));if(!routeMeta[state.route])state.route="shop";render();
</script>
</body>
